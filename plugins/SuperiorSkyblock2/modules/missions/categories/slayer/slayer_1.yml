# The mission file to use
mission-file: KillsMissions

# Whether the mission should be given when completing all requirements.
auto-reward: true

# Nhiệm vụ Đồng Lòng Băng Hải Tặc (Co-op Island Mission)
island: true

# Should entity counts of players get reset when completing the mission?
reset-after-finish: true

# Rewards given when completing the mission.
rewards:
  commands:
    - 'eco give %player% 1000'
    - 'talentadmin addpoints %player% 2'
    - 'is admin msg %player% &e&lSát Thủ | &7Hoàn thành xuất sắc nhiệm vụ Sát Thủ I!'
    - 'is admin msg %player% &e&lSát Thủ | &7Thanh kiếm của bạn vẫn chưa thấm máu... Hãy diệt thêm quái!'
    - 'is admin msg %player% &e&lSát Thủ | &7&oXem nhiệm vụ tiếp theo tại lệnh /is missions'

# List of all required entities must be gathered in order to complete the mission.
required-entities:
  '1':
    types:
      - 'SKELETON'
      - 'CREEPER'
      - 'ZOMBIE'
      - 'SPIDER'
    amount: 5

# Icons used in the menus.
