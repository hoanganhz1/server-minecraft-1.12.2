# The mission file to use
mission-file: KillsMissions

# Whether the mission should be given when completing all requirements.
auto-reward: true

# Nhiệm vụ Đồng Lòng Băng Hải Tặc (Co-op Island Mission)
island: true

# Should entity counts of players get reset when completing the mission?
reset-after-finish: true

# Rewards given when completing the mission.
rewards:
  commands:
    - 'eco give %player% 250000'
    - 'talentadmin addpoints %player% 15'
    - 'is admin unlockworld %player% the_end true'
    - 'is admin msg %player% &e&lSát Thủ | &7Hoàn thành xuất sắc nhiệm vụ Sát Thủ IV!'
    - 'is admin msg %player% &e&lSát Thủ | &7Bạn đã vượt qua mọi thử thách, sẵn sàng tới Thế Giới Tận Cùng...'
    - 'is admin msg %player% &e&lSát Thủ | &7&oChúc mừng bạn đã trở thành Sát Thủ Chuyên Nghiệp!'

# List of required missions that must be completed before completing this one.
required-missions:
  - 'slayer_1'
  - 'slayer_2'
  - 'slayer_3'

# List of all required entities must be gathered in order to complete the mission.
required-entities:
  '1':
    types:
      - 'WITHER'
    amount: 1

