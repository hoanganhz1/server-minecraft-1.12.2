# The mission file to use
mission-file: KillsMissions

# Whether the mission should be given when completing all requirements.
auto-reward: true

# Nhiệm vụ Đồng Lòng Băng Hải Tặc (Co-op Island Mission)
island: true

# Should entity counts of players get reset when completing the mission?
reset-after-finish: true

# Rewards given when completing the mission.
rewards:
  commands:
    - 'eco give %player% 15000'
    - 'talentadmin addpoints %player% 4'
    - 'is admin unlockworld %player% nether true'
    - 'is admin msg %player% &e&lSát Thủ | &7Hoàn thành xuất sắc nhiệm vụ Sát Thủ II!'
    - 'is admin msg %player% &e&lSát Thủ | &7Hãy khám phá Địa Ngục và mang chiến lợi phẩm về!'
    - 'is admin msg %player% &e&lSát Thủ | &7&oXem nhiệm vụ tiếp theo tại lệnh /is missions'

# List of required missions that must be completed before completing this one.
required-missions:
  - 'slayer_1'

# List of all required entities must be gathered in order to complete the mission.
required-entities:
  '1':
    types:
      - 'SKELETON'
    amount: 32
  '2':
    types:
      - 'ZOMBIE'
    amount: 32
  '3':
    types:
      - 'SPIDER'
    amount: 32
  '4':
    types:
      - 'CREEPER'
    amount: 24

