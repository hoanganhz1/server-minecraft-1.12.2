# The mission file to use
mission-file: FarmingMissions

# Whether the mission should be given when completing all requirements.
auto-reward: true

# Should plant counts of players get reset when completing the mission?
reset-after-finish: true

# Rewards given when completing the mission.
rewards:
  commands:
    - 'eco give %player% 1000000'
    - 'talentadmin addpoints %player% 15'
    - 'is admin rankup %player% crop-growth'
    - 'is admin msg %player% &e&lNông Dân | &7Hoàn thành xuất sắc nhiệm vụ Nông Dân V!'
    - 'is admin msg %player% &e&lNông Dân | &7Không có loại nông sản nào làm khó được bạn.'
    - 'is admin msg %player% &e&lNông Dân | &7&oChúc mừng bạn đã trở thành Nông Dân Chuyên Nghiệp!'

# List of required missions that must be completed before completing this one.
required-missions:
  - 'farmer_1'
  - 'farmer_2'
  - 'farmer_3'
  - 'farmer_4'

# List of all required plants must be gathered in order to complete the mission.
required-plants:
  '1':
    types:
      - 'CARROT'
    amount: 320
  '2':
    types:
      - 'POTATO'
    amount: 320
  '3':
    types:
      - 'WHEAT'
    amount: 320
  '4':
    types:
      - 'BEETROOT'
    amount: 320
  '5':
    types:
      - 'PUMPKIN'
    amount: 320
  '6':
    types:
      - 'MELON'
    amount: 320
  '7':
    types:
      - 'SUGAR_CANE'
    amount: 320
  '8':
    types:
      - 'CACTUS'
    amount: 320

