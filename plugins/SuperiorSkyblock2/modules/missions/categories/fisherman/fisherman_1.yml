# The mission file to use
mission-file: FishingMissions

# Whether the mission should be given when completing all requirements.
auto-reward: true

# Rewards given when completing the mission.
rewards:
  commands:
    - 'eco give %player% 2500'
    - 'talentadmin addpoints %player% 2'
    - 'is admin msg %player% &e&lNgư Dân | &7Hoàn thành xuất sắc nhiệm vụ Ngư Dân I!'
    - 'is admin msg %player% &e&lNgư Dân | &7Nghe nói dưới biển còn câu được nhiều món hay lắm...'
    - 'is admin msg %player% &e&lNgư Dân | &7&oXem nhiệm vụ tiếp theo tại lệnh /is missions'

# List of all required caughts must be gathered in order to complete the mission.
required-caughts:
  '1':
    types:
      - 'RAW_FISH'
    amount: 5

