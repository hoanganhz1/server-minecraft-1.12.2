# The mission file to use
mission-file: FishingMissions

# Whether the mission should be given when completing all requirements.
auto-reward: true

# Rewards given when completing the mission.
rewards:
  commands:
    - 'eco give %player% 15000'
    - 'talentadmin addpoints %player% 5'
    - 'is admin msg %player% &e&lNgư Dân | &7Hoàn thành xuất sắc nhiệm vụ Ngư Dân II!'
    - 'is admin msg %player% &e&lNgư Dân | &7Thử vận may câu kho báu xem sao nhé?'
    - 'is admin msg %player% &e&lNgư Dân | &7&oXem nhiệm vụ tiếp theo tại lệnh /is missions'

# List of required missions that must be completed before completing this one.
required-missions:
  - 'fisherman_1'

# List of all required caughts must be gathered in order to complete the mission.
required-caughts:
  '1':
    types:
      - 'BOW'
      - 'ENCHANTED_BOOK'
      - 'FISHING_ROD'
      - 'NAME_TAG'
      - 'SADDLE'
      - 'WATER_LILY'
      - 'BOWL'
      - 'LEATHER'
      - 'LEATHER_BOOTS'
      - 'ROTTEN_FLESH'
      - 'STICK'
      - 'STRING'
      - 'GLASS_BOTTLE'
      - 'BONE'
      - 'INK_SACK'
      - 'TRIPWIRE_HOOK'
    amount: 5

