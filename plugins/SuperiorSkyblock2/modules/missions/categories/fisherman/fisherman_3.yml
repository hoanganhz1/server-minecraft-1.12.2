# The mission file to use
mission-file: FishingMissions

# Whether the mission should be given when completing all requirements.
auto-reward: true

# Rewards given when completing the mission.
rewards:
  commands:
    - 'eco give %player% 50000'
    - 'talentadmin addpoints %player% 10'
    - 'is admin msg %player% &e&lNgư Dân | &7Hoàn thành xuất sắc nhiệm vụ Ngư Dân III!'
    - 'is admin msg %player% &e&lNgư Dân | &7Giờ bạn đã nắm vững nghệ thuật câu cá rồi!'
    - 'is admin msg %player% &e&lNgư Dân | &7&oChúc mừng bạn đã trở thành Ngư Dân Chuyên Nghiệp!'

# List of required missions that must be completed before completing this one.
required-missions:
  - 'fisherman_1'
  - 'fisherman_2'

# List of all required caughts must be gathered in order to complete the mission.
required-caughts:
  '1':
    types:
      - 'BOW'
      - 'ENCHANTED_BOOK'
      - 'FISHING_ROD'
      - 'NAME_TAG'
      - 'SADDLE'
    amount: 3

