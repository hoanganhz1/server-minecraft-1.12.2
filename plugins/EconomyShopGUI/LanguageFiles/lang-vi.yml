item-enchantment-null: Không thể lấy các dòng enchant của vật phẩm.
need-item-enchantment: Không thể tạo enchant với giá trị 0.
item-enchantment-not-supported: Enchant này không được hỗ trợ tại phiên bản này.
enchantment-cannot-apply-to-item: Để enchant lên vật phẩm, vật liệu cần phải là sách enchant hoặc một công cụ phù hợp với enchantment.
item-spawnertype-null: Không thể lấy loại vật phẩm Spawner.
need-item-spawnertype: Không thể tạo spawner với loại trình spawner trống.
material-needs-to-be-spawner: Để áp dụng Loại spawner (Loại thực thể) cho vật phẩm, vật liệu của nó phải là một vật liệu sinh sản.
item-potiontype-null: Không thể lấy loại thuốc của vật phẩm.
need-item-potiontype: Không thể tạo 1 loại thuốc có giá trị trống.
potiontype-not-supported: loại thuốc này không được hỗ trợ ở phiên bản này.
material-needs-to-be-potion: Để áp dụng hiệu ứng thuốc, vật liệu cần phải là một loại thuốc hoặc mũi tên có đầu.
cant-bind-multiple-applyments: Không thể tạo một vật phẩm có nhiều ứng dụng như enchantment/spawner hoặc loại hiệu ứng thuốc.
item-error: '&cMục lỗi, tìm trên bảng điều khiển.'
material-not-supported: Vật phẩm này không được hỗ trợ tại phiên bản này.
item-needs-buy-and-sell-value: Mỗi mặt hàng cần phải có giá trị mua/bán.
sell-value-wrong: Giá bán cần phải có thập phân hoặc giá trị số.
buy-value-wrong: Giá trị mua phải là số thập phân hoặc số.
option-type-changed: Vui lòng thay đổi tùy chọn 'type' thành tùy chọn 'spawnertype' để tạo một spawner trong cửa hàng. Tên của tùy chọn đã thay đổi trong phiên bản 2.2 cho rõ ràng.
option-meta-changed: Vui lòng thay đổi tùy chọn 'meta' thành tùy chọn 'tên hiển thị' để tạo một mặt hàng có tên hiển thị trong cửa hàng. Tên của tùy chọn đã thay đổi trong phiên bản 2.2 cho rõ ràng.
cannot-display-shopsection: Không thể tạo mục cửa hàng '%shopsection%' vì vị trí của vật phẩm cần nằm trong phạm vi từ 0 - %maxInvSize%.
need-recipe-material: Không thể tạo tài liệu công thức có giá trị trống.
cannot-get-recipe-material: Không thể tạo nguyên liệu công thức, vui lòng kiểm tra tên nguyên liệu xem có lỗi chính tả nào không và nếu có.
recipe-material-not-supported: Nguyên liệu công thức đã cho không được hỗ trợ trong phiên bản minecraft này.
material-needs-to-be-book: Để áp dụng công thức cho vật phẩm, tài liệu của vật phẩm cần phải là sách.
need-skullowner: Không thể tạo PlayerHead mà không có người chơi cụ thể (Skull Owner).
material-needs-to-be-skull: Để áp dụng họa tiết đầu lâu (Skull Owner) cho vật phẩm, vật liệu của vật phẩm cần phải là Đầu người chơi.
material-needs-to-be-leather-armor: Để Để áp dụng màu sắc cho một mảnh áo giáp, vật liệu cần phải là áo giáp da.
invalid-item-requirement-type: Loại yêu cầu vật phẩm không hợp lệ cho '%type%'
