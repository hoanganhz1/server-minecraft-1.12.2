#StartUp/Reload
creating-latest-shops: Đang tạo các cửa hàng mặc định cho phiên bản mới nhất vì hiện không tìm thấy bố cục nào phù hợp với phiên bản %version%, vui lòng sử dụng một phiên bản được hỗ trợ.
default-shops-created: Bố cục cửa hàng mặc định tương thích với %version% đã được tạo tại %path%
loaded-shop-configurations: Đã hoàn tất tải %total% cấu hình cửa hàng từ /shops/
default-sections-created: Bố cục phần mặc định được tạo tại %path%
loaded-section-configurations: Đã hoàn tất tải cấu hình mục %total% từ /sections/
updating-shop-settings: Đang cập nhật cài đặt Cửa hàng...
creating-new-shop-config: Tạo cấu hình cửa hàng mới cho '%section%' vì không tìm thấy cấu hình cửa hàng nào trong khi có cấu hình mục. Loại bỏ một cách không chính xác?
creating-new-section-config: Đang tạo cấu hình mục mới cho '%section%' vì không tìm thấy cấu hình phần nào trong khi có cấu hình cửa hàng. Loại bỏ một cách không chính xác?
adding-new-shop-shops,yml: Đang thêm cửa hàng mới có tên %shopsection% vào shops.yml.
adding-new-shop-sections,yml: Đang thêm cửa hàng mới có tên %shopsection% vào sections.yml.
disabled-due-no-vault: Đã tắt do không tìm thấy phần phụ thuộc Vault, vui lòng cài đặt Vault.
disabled-due-no-economy: Đã tắt do không có plugin nền kinh tế, vui lòng cài một plugin như EssentialsX.
update-available: Có một bản cập nhật cho EconomyShopGUI, bạn đang chạy v%plugin_version% nhung tìm thấy v%latest_version%.
done: Đã khởi tạo - mất %millis%ms để hoàn thành
updating-sections-config: Đang cập nhật cấu hình các phần...
debug-mode-enabled: Chế độ gỡ lỗi được bật.
economy-provider-null: Nhà cung cấp kinh tế không có giá trị.
successfully-hooked-into-vault: Đã kết nối thành công vào Vault.
language-file-using: Sử dụng %languagefile% làm tệp ngôn ngữ.
cannot-find-language-file: Không thể tìm thấy tệp ngôn ngữ!
minecraft-version-using: Sử dụng phiên bản minecraft %version%...
checking-each-item: Kiểm tra từng mục để tìm các giá trị sai/thiếu...
loading-items: Đang tải tất cả các mục...
could-not-find-valid-version: Không thể tìm thấy triển khai hợp lệ cho phiên bản máy chủ này. Điều này sẽ khiến plugin không có phiên bản để sử dụng và dẫn đến nhiều items/methods không hoạt động. Vui lòng sử dụng phiên bản minecraft được hỗ trợ.
updating-configs: Đang cập nhật cấu hình vì đã tìm thấy phiên bản mới hơn...
creating-backup: Tạo bản sao lưu từ %fileName% cũ, có thể tìm thấy tệp trong thư mục sao lưu bên trong thư mục của plugin EconomyShopGUI.
discounts-feature-unavailable: Không thể bật tính năng giảm giá vì không tìm thấy plugin quyền nào.
cannot-hook-permissions: Không thể tìm thấy plugin cấp quyền được hỗ trợ
enabled-plugin-hook: Đã bật liên kết %plugin%...
failed-plugin-integration: Không thể liên kết với %plugin%, plugin bị tắt hoặc không tìm thấy...
loading-season-modifiers: Đang tải công cụ sửa đổi mùa từ cấu hình...
loaded-season-modifiers: Đã hoàn tất tải công cụ mùa %total% cho mùa '%season%' trong thế giới '%world%'
no-season-modifiers-found: Không tìm thấy công cụ sửa đổi mùa nào cho mùa %season% trong cấu hình
season-change: Đã phát hiện sự thay đổi mùa trong thế giới '%world%', đang tải công cụ sửa đổi cho mùa %season%...
economy-providers-loaded: Đã hoàn tất tải các plugin cung cấp tiền tệ %total% cho tất cả các mục cửa hàng %shops%.
section-economy-provider-loaded: Sử dụng '%economy%' làm giá trị tiền tệ mặc định cho cửa hàng '%shop%'
loaded-shop-stand-module: Đã hoàn tất việc tải %count% gian hàng từ stands.json
saving-shop-stands: Đang lưu %count% gian hàng trong cửa hàng vào 'stands.json'...
